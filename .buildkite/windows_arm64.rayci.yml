group: windows arm64 tests
sort_key: "~windows_arm64"
steps:
  # block on premerge and microcheck
  - block: "run windows arm64 tests"
    if: build.env("BUILDKITE_PIPELINE_ID") == "0189942e-0876-4b8f-80a4-617f988ec59b" || build.env("BUILDKITE_PIPELINE_ID") == "018f4f1e-1b73-4906-9802-92422e3badaa"

  - name: windowsarm64build
    wanda: ci/docker/windows.arm64.build.wanda.yaml
    instance_type: builder-windows-arm64

  - label: ":windows: arm64 wheel {{matrix}}"
    key: windows_arm64_wheels
    tags:
      - oss
      - python
      - core_cpp
      - release_wheels
      - windows_arm64
    job_env: WINDOWS_ARM64
    instance_type: windows-arm64
    commands:
      - bash ci/ray_ci/windows/install_tools.sh
      - bazel run //ci/ray_ci:build_in_docker_windows -- wheel --python-version {{matrix}} --operating-system windows --architecture arm64 --upload
    matrix:
      - "3.9"
      - "3.10"
      - "3.11"
      - "3.12"
    depends_on: windowsarm64build

  - label: ":ray: core: :windows: arm64 cpp tests"
    tags:
      - core_cpp
      - windows_arm64
    job_env: WINDOWS_ARM64
    instance_type: windows-arm64
    commands:
      - bash ci/ray_ci/windows/install_tools.sh
      - bazel run //ci/ray_ci:test_in_docker -- //:all //src/... core
        --build-name windowsarm64build
        --operating-system windows
        --architecture arm64
        --except-tags no_windows,cgroup
        --test-env=CI="1"
        --test-env=RAY_CI_POST_WHEEL_TESTS="1"
        --test-env=USERPROFILE
        --parallelism-per-worker 2
    depends_on: windowsarm64build

  - label: ":ray: core: :windows: arm64 python tests"
    tags:
      - python
      - windows_arm64
    job_env: WINDOWS_ARM64
    instance_type: windows-arm64
    parallelism: 5
    commands:
      - bash ci/ray_ci/windows/install_tools.sh
      - bazel run //ci/ray_ci:test_in_docker -- //python/ray/tests/... core
        --build-name windowsarm64build
        --operating-system windows
        --architecture arm64
        --except-tags no_windows
        --test-env=CI="1"
        --test-env=RAY_CI_POST_WHEEL_TESTS="1"
        --test-env=USERPROFILE
        --workers "$${BUILDKITE_PARALLEL_JOB_COUNT}" --worker-id "$${BUILDKITE_PARALLEL_JOB}" --parallelism-per-worker 2
    depends_on: windowsarm64build

  - label: ":ray-serve: serve: :windows: arm64 tests"
    tags:
      - serve
      - windows_arm64
    job_env: WINDOWS_ARM64
    instance_type: windows-arm64
    parallelism: 2
    commands:
      - bash ci/ray_ci/windows/install_tools.sh
      - bazel run //ci/ray_ci:test_in_docker -- //python/ray/serve/... serve
        --build-name windowsarm64build
        --operating-system windows
        --architecture arm64
        --except-tags no_windows,use_all_core_windows
        --test-env=CI="1"
        --test-env=RAY_CI_POST_WHEEL_TESTS="1"
        --test-env=USERPROFILE
        --workers "$${BUILDKITE_PARALLEL_JOB_COUNT}" --worker-id "$${BUILDKITE_PARALLEL_JOB}" --parallelism-per-worker 3
    depends_on: windowsarm64build
